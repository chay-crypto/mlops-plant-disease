services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    deploy:
      replicas: 2
    env_file: .env
    volumes:
      - ./models:/models:ro
      - ./monitoring:/app/monitoring:ro
      - ./logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://nginx
    depends_on:
      - nginx
    restart: unless-stopped